name: bdh-hermes-bridge
version: 0.8.0
description: "Bidirectional bridge between Hermes Agent and BDH Graph Harness — independent rewrite routing for retrieval/storage, conditionally retrieves read-only context, auto-feeds completed sessions, adds cross-session synthesis, and provides BDH tools."
author: albi
kind: standalone
provides_hooks:
  - pre_llm_call
  - post_api_request
  - post_tool_call
  - transform_llm_output
  - on_session_finalize
  - on_session_reset
provides_tools:
  - bdh_query
  - bdh_stats
